# Fly.io deployment config for Household Ops MCP server
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy:
#   fly launch  (first time)
#   fly deploy  (subsequent deploys)
#   fly secrets set AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_REGION=us-east-1

app = "household-ops-mcp"
primary_region = "sin"   # Singapore – closest to India

[build]

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  EXPIRY_WARN_DAYS = "5"
  PORT = "8000"
